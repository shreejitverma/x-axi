name: release

# Publishes to npm with trusted publishing (OIDC, no token secret) and creates the GitHub Release.
# One-time setup on npmjs.com is described in CONTRIBUTING.md under "Releasing".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # id-token mints the OIDC token npm trusted publishing and provenance need; contents creates the Release.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tag can be checked against main.
          fetch-depth: 0

      # Standalone as in ci.yml; with no version input it installs the packageManager version from package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json and is on main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi

      - name: Check npm supports trusted publishing
        run: |
          # Trusted publishing needs npm 11.5.1 or newer.
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is older than 11.5.1, which trusted publishing needs"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # X_AXI_TEST_DIALOG stays unset, so no test opens a real dialog here.
      - run: pnpm test

      # A rerun, or a tag for a version first published by hand, must not fail on a publish npm already has.
      # Only a clean 404 from the registry counts as unpublished; any other lookup failure stops the release.
      - name: Check whether this version is already on npm
        id: npm
        run: |
          spec="$(node -p "const p=require('./package.json'); p.name + '@' + p.version")"
          if out="$(npm view "${spec}" version 2>&1)"; then
            echo "::notice::${spec} is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "${out}" | grep -q 'E404'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not check npm for ${spec}: ${out}"
            exit 1
          fi

      # prepublishOnly cleans, rebuilds, and tests again from the same checkout.
      - if: steps.npm.outputs.published == 'false'
        run: npm publish --provenance --access public

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
