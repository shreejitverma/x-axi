name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Standalone because this step runs before setup-node, which needs pnpm for its cache; pnpm brings its own Node instead of the runner default.
      - uses: pnpm/action-setup@v6
        with:
          standalone: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
      # X_AXI_TEST_DIALOG stays unset, so no test opens a real dialog here.
      - run: pnpm test
