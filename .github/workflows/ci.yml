name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Standalone because pnpm 11 cannot run on Node 20; its own Node stays separate from the matrix version.
      - uses: pnpm/action-setup@v4
        with:
          standalone: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
      # X_AXI_TEST_DIALOG stays unset, so no test opens a real dialog here.
      - run: pnpm test
